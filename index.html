      if (state.showStats) { if (click || pressed('Space') || pressed('Enter') || pressed('Escape')) state.showStats = false; return; }
      if (!last) {
        if (click && inRect(click, 590, 912, 110, 40)) { state.cardI = state.cards.length - 1; state.cardT = 0; Music.sfx('tab'); return; } // SKIP to the rewards
        if (pressed('Space') || pressed('Enter') || (click && (inRect(click, 160, 1030, 400, 70) || inRect(click, 60, 440, 600, 480)))) go();
        return;
      }
      if (!state.adClaimed && !state.reviveAdDeclined && (pressed('KeyA') || (click && inRect(click, 110, 948, 500, 60)))) return startAd('double', claimDouble, 'over'); // one ask per run end

    },

      text('THE BOARD FILLED', W / 2, 140, 38, '#ff6b7a', 'center', '800', 600);
      text(fmtN(state.score), W / 2, 240, 104, '#ffffff', 'center', '900');

      text('Round ' + state.round + '   Time ' + fmtTime(st.time || 0), W / 2, 364, 24, '#c8d0ff', 'center', '600');
      const nb = state.nextBoss; if (nb) text('Next Warden: round ' + nb.round + ', ' + nb.drops + ' drops away', W / 2, 400, 20, '#ff9d8d', 'center', '700', 640);
      btn(590, 24, 110, 44, 'STATS', !!state.showStats, '#9db4ff', 16);
      if (state.showStats) drawResultStats(st); else { drawResultCard(); if (state.cards.length > 1) for (let i = 0; i < state.cards.length; i++) { ctx.fillStyle = i === state.cardI ? '#ffffff' : '#3a4580'; ctx.beginPath(); ctx.arc(W / 2 + (i - (state.cards.length - 1) / 2) * 26, 930, i === state.cardI ? 8 : 6, 0, 7); ctx.fill(); } }
      if (!last) { if (!state.showStats) btn(590, 912, 110, 40, 'SKIP', true, '#6f7bc4', 16); btn(160, 1030, 400, 70, 'NEXT', true, '#7dffb0', 30); }
      else {
        if (!state.adClaimed && !state.reviveAdDeclined) btn(110, 948, 500, 60, (adFree() ? 'DOUBLE COINS  (+' : 'WATCH AD: DOUBLE COINS  (+') + (st.coins || 0) + ')', true, '#ffd23f', 24);
        if (workshopOpen()) { btn(60, 1030, 190, 70, 'RUN AGAIN', true, '#7dffb0', 22); btn(265, 1030, 190, 70, 'WORKSHOP', true, '#5b78ff', 22); btn(470, 1030, 190, 70, 'MAIN MENU', true, '#9db4ff', 22); }
        else { btn(110, 1030, 190, 70, 'RUN AGAIN', true, '#7dffb0', 22); btn(420, 1030, 190, 70, 'MAIN MENU', true, '#9db4ff', 22); }
        if (tune.ad_banner && !adFree()) { ctx.save(); ctx.setLineDash([10, 8]); ctx.lineWidth = 2; ctx.strokeStyle = '#3a4580'; rr(80, 1166, 560, 70, 10); ctx.stroke(); ctx.restore(); text('AD SPACE', W / 2, 1201, 22, '#4a5590', 'center', '700'); } // reserved for a banner ad
      }
    },
  },
};
scenes.shop = {
  update(dt) {
    shopMsgT = Math.max(0, shopMsgT - dt); if (shopMsgT === 0) shopMsg = '';
    if (pressed('Escape')) return leaveShop();
    if (down.has('ArrowDown')) wsScroll += 16; if (down.has('ArrowUp')) wsScroll -= 16;
    const L = shopBuild(); wsMax = Math.max(0, L.total - (WS_BOT - SHOP_TOP)); wsScroll = Math.max(0, Math.min(wsMax, wsScroll));
    if (!click) return; const c = click;
    if (inRect(c, 160, 1124, 400, 70)) { Music.sfx('back'); return leaveShop(); }
    if (c.y >= SHOP_TOP && c.y <= WS_BOT) { const cy = c.y - SHOP_TOP + wsScroll; for (const it of L.items) if (cy >= it.y && cy <= it.y + it.h) for (const b of it.btns || []) if (inRect({ x: c.x, y: cy - it.y }, b.x, b.y, b.w, b.h)) { if (!b.on) { Music.sfx('deny'); continue; } b.act(); if (b.key.startsWith('buy:')) Music.sfx('open'); else if (b.key === 'restore') Music.sfx('click'); } }
  },
  draw() {
    bg(); menuBackdrop('#ffc93c', '#36c5ff'); text('SHOP', 24, 40, 40, '#ffffff', 'left', '800', 240);
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(528, 40, 13, 0, 7); ctx.fill(); ctx.strokeStyle = '#a07a10'; ctx.lineWidth = 3; ctx.stroke(); text(fmtN(meta.coins), 548, 40, 28, '#ffd23f', 'left', '800', 84);
    gemIcon(648, 40, 14); text(String(meta.gems), 668, 40, 28, '#8be9ff', 'left', '800', 48);
    const L = shopBuild(), view = WS_BOT - SHOP_TOP; wsMax = Math.max(0, L.total - view); wsScroll = Math.max(0, Math.min(wsMax, wsScroll));
    ctx.save(); ctx.beginPath(); ctx.rect(0, SHOP_TOP, W, view); ctx.clip(); ctx.translate(0, SHOP_TOP - wsScroll);
    for (const it of L.items) if (it.y + it.h >= wsScroll - 10 && it.y <= wsScroll + view + 10) shopDrawItem(it);
    ctx.restore();
    if (wsMax > 0) { const th = Math.max(50, view * view / L.total), ty = SHOP_TOP + (view - th) * (wsScroll / wsMax); rr(W - 9, ty, 5, th, 3); ctx.fillStyle = 'rgba(160,180,255,0.45)'; ctx.fill(); }
    if (wsScroll < wsMax - 4) { const g = ctx.createLinearGradient(0, WS_BOT - 40, 0, WS_BOT); g.addColorStop(0, 'rgba(8,11,31,0)'); g.addColorStop(1, 'rgba(8,11,31,0.95)'); ctx.fillStyle = g; ctx.fillRect(0, WS_BOT - 40, W, 40); }
    if (shopMsg) { rr(110, WS_BOT - 62, 500, 46, 23); ctx.fillStyle = 'rgba(6,9,28,0.94)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#7dffb0'; ctx.stroke(); text(shopMsg, W / 2, WS_BOT - 39, 24, '#7dffb0', 'center', '700', 470); }
    btn(160, 1124, 400, 70, 'BACK', true, '#7dffb0', 30);
    if (!TOUCH) text('Esc: back   Wheel or Up/Down: scroll', W / 2, 1258, 17, '#6f7bc4', 'center', '600');
  },
};
scenes.pay = { // a stand-in for the platform's own purchase sheet
  update() {
    if (pressed('Escape')) { scene = payJob.ret; payJob = null; return; }
    if (!click) return; const c = click;
    if (inRect(c, 110, 660, 500, 70)) { const id = payJob.id, pr = PRODUCTS().find(x => x.id === id), g = platform.complete(id); scene = payJob.ret; shopMsg = g ? 'Gems +' + g : pr.name + ' is yours'; shopMsgT = 3; payJob = null; fanfare(2); Music.sfx(g ? 'gem' : 'cash'); Music.sfx('cash'); return; }
    if (inRect(c, 110, 744, 500, 60)) { scene = payJob.ret; payJob = null; Music.sfx('back'); }
  },
  draw() {
    scenes.shop.draw(); ctx.fillStyle = 'rgba(4,6,20,0.82)'; ctx.fillRect(0, -VOFF, W, H);
    const pr = PRODUCTS().find(x => x.id === payJob.id);
    rr(60, 380, 600, 440, 24); ctx.fillStyle = '#1a2150'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#6f7bc4'; ctx.stroke();
    text('STORE (placeholder)', W / 2, 428, 24, '#9db4ff', 'center', '700', 520); text(pr.name, W / 2, 500, 44, '#ffffff', 'center', '800', 520);
    text(pr.kind === 'gems' ? grantOf(pr) + ' gems' : pr.kind === 'bundle' ? 'Remove Ads + ' + pr.n + ' gems' : 'One-time purchase', W / 2, 556, 26, '#8be9ff', 'center', '700', 520); text(money(pr.price), W / 2, 616, 40, '#ffd23f', 'center', '800', 520);
    btn(110, 660, 500, 70, 'CONFIRM PURCHASE', true, '#7dffb0', 28); btn(110, 744, 500, 60, 'CANCEL', true, '#ff6b7a', 24);
  },
};
scenes.ad = { // the fake ad: a countdown, then a claim button
  update() {
    const j = adJob; j.t += STEP; const done = j.t >= j.dur;
    if (click) {
      if (done && inRect(click, 160, 1000, 400, 76)) { const f = j.onDone; scene = j.ret; adJob = null; f(); return; }
      if (!done && j.t > 2 && inRect(click, W - 190, 24, 160, 46)) { scene = j.ret; adJob = null; } // closing early gives no reward
    }
  },
  draw() {
    const j = adJob, done = j.t >= j.dur, k = Math.min(1, j.t / j.dur); bg();
    text('ADVERTISEMENT', 40, 48, 20, '#6f7bc4', 'left', '700');
    if (!done && j.t > 2) btn(W - 190, 24, 160, 46, 'CLOSE (no reward)', true, '#6f7bc4', 14);
    const g = ctx.createLinearGradient(60, 180, 660, 780); g.addColorStop(0, `hsl(${(j.t * 40) % 360},60%,28%)`); g.addColorStop(1, `hsl(${(j.t * 40 + 120) % 360},60%,18%)`);
    rr(60, 180, 600, 600, 24); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff44'; ctx.stroke();
    for (let q = 0; q < 5; q++) tile(110 + q * 100, 330 + 20 * Math.sin(j.t * 3 + q), 90, q);
    text('YOUR AD HERE', W / 2, 520, 60, '#ffffff', 'center', '900'); text('A placeholder: no ad network is connected', W / 2, 580, 24, '#ffffffbb', 'center', '600');
    rr(120, 860, 480, 18, 9); ctx.fillStyle = '#141a40'; ctx.fill(); rr(120, 860, Math.max(14, 480 * k), 18, 9); ctx.fillStyle = '#ffd23f'; ctx.fill();
    text(done ? 'Thanks for watching!' : 'Reward in ' + Math.ceil(j.dur - j.t) + ' s', W / 2, 920, 30, '#ffffff', 'center', '800');
    if (done) btn(160, 1000, 400, 76, j.kind === 'revive' ? 'CLAIM REVIVE' : j.kind === 'gems' ? 'CLAIM GEMS' : 'CLAIM DOUBLE COINS', true, '#7dffb0', 28);
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { toggleMute(); hit.delete('KeyM'); }
  if (infoSheet && click) { infoSheet = null; click = null; hit.clear(); return; } // a tap closes the information sheet and does nothing else
  scenes[scene].update(STEP); hit.clear(); click = null;
}
let last, acc = 0, ALPHA = 1;
function dangerLevel() { let top = R; for (let c = 0; c < COLS; c++) top = Math.min(top, colTop(c)); return Math.max(0, Math.min(1, (HID + 4 - top) / 4)); }
function musicState() { // what the music needs to know, small and steady so it only reacts to real changes
  const sc = scene, o = { bed: null };
  // the Shop shares the Workshop's music
  if (sc === 'title') o.bed = 'menu'; else if (sc === 'workshop' || sc === 'figures' || sc === 'shop' || sc === 'pay') o.bed = 'workshop';
  else if (sc === 'over') o.bed = 'over'; else if (sc === 'play' || sc === 'pause') o.bed = 'play';
  o.quick = o.bed !== 'over'; // the end screen waits for the bar; everything the player taps crossfades quickly
  if (o.bed === 'play') {
    const s = state, e = s.effects[0], tipBack = s.phase === 'tip' ? s.tipReturn : '';
    o.tier = comboTier(s.comboCount); o.combo = s.comboCount >= 3 ? 3 : 0; o.boss = s.boss && (!s.boss.done || s.phase === 'bossIntro') ? s.boss.type : ''; o.bossTier = o.boss ? s.boss.tier : 0; o.danger = Math.round(dangerLevel() * 4) / 4;
    o.good = !!(e && e.good); o.bad = !!(e && !e.good); o.choice = (s.phase === 'relic' || s.phase === 'chest' || s.phase === 'joker' || s.phase === 'jokerReveal' || tipBack === 'relic' || tipBack === 'joker') ? 1 : 0;
    o.revive = s.phase === 'revive'; o.paused = sc === 'pause'; o.tip = s.phase === 'tip';
  }
  return o;
}
function tick() {
  Music.set(musicState());
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
// The Workshop, Shop and purchase sheet do not move between taps, so a finished frame is kept and reused until anything on screen changes
// (this keeps scrolling smooth on slow phones and saves battery). A reused frame is pixel-identical to a fresh draw: framecache.mjs checks that.
let FRAME_CACHE = true, frameCache = null, frameKey = '';
const menuFrameKey = () => [scene, !!infoSheet, amuletSheet, wsTab, wsScroll, wsMsg, shopMsg, payJob ? payJob.id : '', LANG, canvas.width, canvas.height, VOFF, Math.floor(Date.now() / 60000), JSON.stringify(meta)].join('|'); // the minute is for the reset countdown
function drawFrame() {
  const cacheable = FRAME_CACHE && (scene === 'workshop' || scene === 'missions' || scene === 'shop' || scene === 'pay');
  if (cacheable) { const key = menuFrameKey(); if (frameCache && key === frameKey) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(frameCache, 0, 0); ctx.restore(); return; } frameKey = key; }
  ctx.save(); ctx.translate(0, VOFF); scenes[scene].draw(); drawInfoSheet(); ctx.restore();
  if (cacheable) { frameCache = frameCache || document.createElement('canvas'); if (frameCache.width !== canvas.width || frameCache.height !== canvas.height) { frameCache.width = canvas.width; frameCache.height = canvas.height; } frameCache.getContext('2d').drawImage(canvas, 0, 0); }
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
